# The gates every change to visualize passes (spec/12 §4). `scripts/check.exs`, run as
# `mix vis.check`, is the local mirror of this file: every job here, in this order.
#
# Compiled dependencies come from the depdep store (scripts/depdep.exs): one `--pull
# --mix-get --compile-deps` line runs the pull, `mix deps.get` inside it (fetching source
# first would give it fresh mtimes and Mix would rebuild what was just restored), a second
# decision once the source is on disk, and a compile of exactly what the store lacked.
# `--push` runs only after a green build. The library jobs exclude the examples member,
# which the examples job pulls and pushes itself (#342, #343). Without the DEPDEP_*
# variables depdep is a no-op that exits 0.
#
# depdep is the only dependency cache (#588): no job has a GitLab runner `cache:`. A runner
# cache served a job before depdep was asked, so a job it covered never touched the store,
# and a store that had moved went unnoticed while every build stayed green. The DEPDEP_*
# variables come from the DCOTek group. Neither a project-level variable nor this file may
# set them, since either overrides the group's (the store moved to exio on 2026-10-12, and a
# stale project override pointed visualize at the old one). A store that cannot be reached
# degrades to a cold build, never a failed one.
#
# The private git dependency (extla; depdep and surfex come from Hex, #634) is reached with the
# job token through the two `insteadOf` rewrites below. This only works because
# dco-tek/visualize is on extla's inbound job-token allowlist (Settings → CI/CD → Token
# Access), which is per project and not inherited from the group; the failure mode is `HTTP
# Basic: Access denied`, which reads like a credential bug and is not.

stages:
  - check
  - verify
  - quality

variables:
  # Pinned to .tool-versions.
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim
  GIT_DEPTH: "20"

default:
  tags:
    - DCOTek
  interruptible: true

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    # `--add`: both rewrites share one key and plain `git config` REPLACES a key's value.
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
    - mix local.hex --force
    - mix local.rebar --force
    # A store that cannot be reached must not fail the build: fall back to a bare deps.get.
    # With --mix-get, mix deps.get's own failure is this line's failure, as it was before.
    - elixir scripts/depdep.exs --pull --mix-get --compile-deps --exclude examples || mix deps.get

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    - mix compile --force --warnings-as-errors
    - elixir scripts/depdep.exs --push --exclude examples || echo "depdep bootstrap failed - nothing pushed"

# The raster tests run the resvg binary (spec/12 §4, D-121): a pinned upstream release,
# checked against its SHA-256 before use. test/test_helper.exs fails the suite when
# VISUALIZE_RESVG names no executable, so a job that downloads it never skips them
# silently. Moving to another release changes RESVG_URL and RESVG_SHA256 together. The
# `test` job and `verify:hooks` both take it from here (D-179).
.resvg:
  variables:
    RESVG_URL: https://github.com/linebender/resvg/releases/download/v0.48.1/resvg-linux-x86_64.tar.gz
    RESVG_SHA256: fa8c26495a187e592c501db15bf9e8a9fdc051d4b2b336b39703d5b59f912b9d
  script:
    - apt-get install -y -qq --no-install-recommends curl
    - curl -fsSL -o resvg.tar.gz "$RESVG_URL"
    - echo "$RESVG_SHA256  resvg.tar.gz" | sha256sum -c -
    - mkdir -p .resvg && tar -xzf resvg.tar.gz -C .resvg resvg
    - export VISUALIZE_RESVG="$CI_PROJECT_DIR/.resvg/resvg"
    - $VISUALIZE_RESVG --version

test:
  extends: [.elixir, .resvg]
  stage: check
  script:
    - !reference [.resvg, script]
    - mix test --warnings-as-errors --cover
  coverage: '/\|\s+(\d+\.\d+)%\s+\|\s+Total\s+\|/'
  artifacts:
    when: on_failure
    paths:
      - cover
    expire_in: 1 week

# THE SURFACE GATE (spec/12 §2). HARD: API_SURFACE.md is generated, so a difference means
# it was hand-edited or spec/ or lib/ changed without a regenerate.
verify:api-surface:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: dev
  script:
    - mix vis.surface --check

verify:headings:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: dev
  script:
    - mix vis.headings

# Every spec/NN §id citation names a heading (spec/12 §3, #648).
verify:citations:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: dev
  script:
    - mix vis.citations

# Everything the library names and writes is spelled American (spec/12 §3, #642, D-183).
verify:spelling:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: dev
  script:
    - mix vis.spelling

verify:models:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: dev
  script:
    - mix vis.verify

# The canvas hooks executed under node against a recording DOM stub (spec/12 §6, #458).
# ExUnit drives the engine, so the job is the Elixir image with Debian's nodejs (18 on
# bookworm, ES modules and atob included) added; `mix test` elsewhere excludes :js when
# no node is on the path, and here `--only js` runs exactly those tests.
#
# It has resvg too (#679, D-179): a :js_resvg test replays a hook under node and compares
# what it drew with resvg's raster of the same SVG, so this is the one job with both.
verify:hooks:
  extends: [.elixir, .resvg]
  stage: verify
  variables:
    MIX_ENV: test
  script:
    - apt-get install -y -qq --no-install-recommends nodejs
    - node --version
    - !reference [.resvg, script]
    - mix test --warnings-as-errors --only js --include js_resvg

# What a consumer compiles: lib/ alone, with neither audit/, specs/, surfex nor extla, and
# neither Phoenix nor Nx. This checkout's own prod build carries the optional deps, so the
# proof is a throwaway project depending on visualize and on nothing else (spec/12 §4).
consumer-compile:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: prod
  script:
    - mix compile --force --warnings-as-errors
    - elixir scripts/consumer_check.exs

# The gallery is the only thing that exercises the LiveView side; it must keep building.
# The gallery is the only thing that exercises the LiveView side; it must keep building
# AND its pages must keep rendering — its suite fetches every route (#331).
examples:test:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: test
  script:
    - cd examples
    # The examples member's dependencies, pulled from the store and pushed after a green
    # run by the one job that builds them (#342).
    - elixir ../scripts/depdep.exs --pull --mix-get --compile-deps || mix deps.get
    - mix compile --warnings-as-errors
    - mix test --warnings-as-errors
    - elixir ../scripts/depdep.exs --push || echo "depdep bootstrap failed - nothing pushed"

credo:
  extends: .elixir
  stage: quality
  script:
    - mix credo --strict

docs:
  extends: .elixir
  stage: quality
  variables:
    MIX_ENV: dev
  script:
    - mix docs --warnings-as-errors
