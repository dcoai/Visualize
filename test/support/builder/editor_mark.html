<div class="vis-builder-editor">
  <nav class="vis-builder-tabs">
    <button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="binding">binding</button><button type="button" class="vis-builder-tab vis-builder-tab-open" phx-click="facet" phx-value-facet="channel">channel</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="geometry">geometry</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="style">style</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="content">content</button>
  </nav>
  <form id="vis-builder-editor-marks-0-form" class="vis-builder-form" phx-change="edit" phx-hook="BuilderHook" data-builder-scope="ref" data-builder-edit="edit" phx-submit="submitted">
    
    
    <fieldset class="vis-builder-form-body">
    
    <label class="vis-builder-field" data-builder-bind="type" phx-keyup="select_field" phx-value-field="type">
  <span class="vis-builder-key">
    type
    <span class="vis-builder-field-handle" draggable="true" data-builder-promote="type" title="drag to the variables panel to make a variable of this value" aria-hidden="true">⠿</span>
  </span>
  
  
  
  
  
  
  
  
  
  
  
  
  
  <select name="type">
    <option value=""></option>
    <option value="line" selected>line</option><option value="area">area</option><option value="band">band</option><option value="rule">rule</option><option value="x_band">x_band</option><option value="percentile_band">percentile_band</option><option value="rose">rose</option><option value="symbol">symbol</option><option value="needle">needle</option><option value="arc">arc</option><option value="path">path</option><option value="rect">rect</option><option value="circle">circle</option><option value="text">text</option><option value="tiles">tiles</option><option value="choose">choose</option>
    
  </select>
  
  
  
  
  
  
</label>
<label class="vis-builder-field" data-builder-bind="channels" phx-keyup="select_field" phx-value-field="channels">
  <span class="vis-builder-key">
    channels
    <span class="vis-builder-field-handle" draggable="true" data-builder-promote="channels" title="drag to the variables panel to make a variable of this value" aria-hidden="true">⠿</span>
  </span>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <textarea name="channels" placeholder="%{}">%{x: :t, y: :v}</textarea>
  
</label>
<label class="vis-builder-field" data-builder-bind="scales" phx-keyup="select_field" phx-value-field="scales">
  <span class="vis-builder-key">
    scales
    
  </span>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <textarea name="scales" placeholder="%{}"></textarea>
  
</label>
<label class="vis-builder-field" data-builder-bind="offset" phx-keyup="select_field" phx-value-field="offset">
  <span class="vis-builder-key">
    offset
    
  </span>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <textarea name="offset" placeholder="%{}"></textarea>
  
</label>

    </fieldset>
  </form>
</div>
