<div class="vis-builder-editor">
  <nav class="vis-builder-tabs">
    <button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="binding">binding</button><button type="button" class="vis-builder-tab vis-builder-tab-open" phx-click="facet" phx-value-facet="channel">channel</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="geometry">geometry</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="style">style</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="content">content</button>
  </nav>
  <datalist id="vis-builder-editor-variables">
    
  </datalist>
  <form id="vis-builder-editor-form" class="vis-builder-form" phx-change="edit" phx-hook="BuilderHook" data-builder-scope="ref">
    <label class="vis-builder-field">
      <span class="vis-builder-key">
        type
      </span>
      <select name="type.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      
      <select name="type">
        <option value=""></option>
        <option value="line" selected>line</option><option value="area">area</option><option value="band">band</option><option value="rule">rule</option><option value="x_band">x_band</option><option value="percentile_band">percentile_band</option><option value="rose">rose</option><option value="symbol">symbol</option><option value="arc">arc</option><option value="path">path</option><option value="rect">rect</option><option value="circle">circle</option>
      </select>
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        channels
      </span>
      <select name="channels.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      
      
      
      <textarea name="channels" placeholder="%{}">%{x: :t, y: :v}</textarea>
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        scales
      </span>
      <select name="scales.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      
      
      
      <textarea name="scales" placeholder="%{}"></textarea>
      
    </label>
  </form>
</div>
