<div class="vis-builder-editor">
  <nav class="vis-builder-tabs">
    <button type="button" class="vis-builder-tab vis-builder-tab-open" phx-click="facet" phx-value-facet="binding">binding</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="channel">channel</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="geometry">geometry</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="style">style</button><button type="button" class="vis-builder-tab" phx-click="facet" phx-value-facet="content">content</button>
  </nav>
  <datalist id="vis-builder-editor-variables">
    
  </datalist>
  <form id="vis-builder-editor-form" class="vis-builder-form" phx-change="edit" phx-hook="BuilderHook" data-builder-scope="ref">
    <label class="vis-builder-field">
      <span class="vis-builder-key">
        sources
      </span>
      <select name="sources.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      <textarea name="sources" placeholder="%{}"></textarea>
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        vars
      </span>
      <select name="vars.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      <textarea name="vars" placeholder="%{}"></textarea>
      
    </label>
  </form>
</div>
