<ol id="b-layers" class="vis-builder-layers" phx-hook="BuilderHook">
  <li class="vis-builder-layer vis-builder-layer-disabled" data-builder-layer="0" draggable="true">
    <span class="vis-builder-layer-name">house</span>
    <button type="button" class="vis-builder-layer-select" title="Edit house" aria-label="Edit house" phx-click="select_layer" phx-value-index="0"><span class="vis-builder-action-label">Edit</span></button>
    <button type="button" class="vis-builder-layer-up" title="Move house up" aria-label="Move house up" phx-click="move_layer" phx-value-index="0" phx-value-to="-1"><span class="vis-builder-action-label">Up</span></button>
    <button type="button" class="vis-builder-layer-down" title="Move house down" aria-label="Move house down" phx-click="move_layer" phx-value-index="0" phx-value-to="1"><span class="vis-builder-action-label">Down</span></button>
    <button type="button" class="vis-builder-layer-toggle" title="Enable house" aria-label="Enable house" phx-click="toggle_layer" phx-value-index="0"><span class="vis-builder-action-label">Enable</span></button>
  </li><li class="vis-builder-layer" data-builder-layer="1" draggable="true">
    <span class="vis-builder-layer-name">shared</span>
    <button type="button" class="vis-builder-layer-select" title="Edit shared" aria-label="Edit shared" phx-click="select_layer" phx-value-index="1"><span class="vis-builder-action-label">Edit</span></button>
    <button type="button" class="vis-builder-layer-up" title="Move shared up" aria-label="Move shared up" phx-click="move_layer" phx-value-index="1" phx-value-to="0"><span class="vis-builder-action-label">Up</span></button>
    <button type="button" class="vis-builder-layer-down" title="Move shared down" aria-label="Move shared down" phx-click="move_layer" phx-value-index="1" phx-value-to="2"><span class="vis-builder-action-label">Down</span></button>
    <button type="button" class="vis-builder-layer-toggle" title="Disable shared" aria-label="Disable shared" phx-click="toggle_layer" phx-value-index="1"><span class="vis-builder-action-label">Disable</span></button>
  </li><li class="vis-builder-layer vis-builder-layer-selected" data-builder-layer="2" draggable="true">
    <span class="vis-builder-layer-name">panel</span>
    <button type="button" class="vis-builder-layer-select" title="Edit panel" aria-label="Edit panel" phx-click="select_layer" phx-value-index="2"><span class="vis-builder-action-label">Edit</span></button>
    <button type="button" class="vis-builder-layer-up" title="Move panel up" aria-label="Move panel up" phx-click="move_layer" phx-value-index="2" phx-value-to="1"><span class="vis-builder-action-label">Up</span></button>
    <button type="button" class="vis-builder-layer-down" title="Move panel down" aria-label="Move panel down" phx-click="move_layer" phx-value-index="2" phx-value-to="3"><span class="vis-builder-action-label">Down</span></button>
    <button type="button" class="vis-builder-layer-toggle" title="Disable panel" aria-label="Disable panel" phx-click="toggle_layer" phx-value-index="2"><span class="vis-builder-action-label">Disable</span></button>
  </li>
</ol>
