<div class="vis-builder-editor">
  <nav class="vis-builder-tabs">
    <button type="button" class="vis-builder-tab vis-builder-tab-open" phx-click="facet" phx-value-facet="style">style</button>
  </nav>
  <datalist id="vis-builder-editor-variables">
    
  </datalist>
  <form id="vis-builder-editor-form" class="vis-builder-form" phx-change="edit" phx-hook="BuilderHook" data-builder-scope="ref">
    <label class="vis-builder-field" data-builder-ref="extends">
      <span class="vis-builder-key">
        extends
      </span>
      <select name="extends.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="extends">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        fill
      </span>
      <select name="fill.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      <select name="fill.slot" class="vis-builder-slot" title="a theme slot">
        <option value="">slot…</option>
        
      </select>
      <input type="color" name="fill" class="vis-builder-colour" title="a colour">
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke
      </span>
      <select name="stroke.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      <select name="stroke.slot" class="vis-builder-slot" title="a theme slot">
        <option value="">slot…</option>
        
      </select>
      <input type="color" name="stroke" class="vis-builder-colour" title="a colour">
      
      
      <ul class="vis-builder-key-errors">
        <li class="vis-builder-error">styles.series.stroke: slot :series_1 is not a slot of the theme</li>
      </ul>
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke_width
      </span>
      <select name="stroke_width.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="stroke_width" value="2">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke_dasharray
      </span>
      <select name="stroke_dasharray.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="stroke_dasharray">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke_linecap
      </span>
      <select name="stroke_linecap.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      <select name="stroke_linecap">
        <option value=""></option>
        <option value="butt">butt</option><option value="round">round</option><option value="square">square</option>
      </select>
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke_linejoin
      </span>
      <select name="stroke_linejoin.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      <select name="stroke_linejoin">
        <option value=""></option>
        <option value="miter">miter</option><option value="round">round</option><option value="bevel">bevel</option>
      </select>
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        opacity
      </span>
      <select name="opacity.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="opacity">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        fill_opacity
      </span>
      <select name="fill_opacity.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="fill_opacity">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        stroke_opacity
      </span>
      <select name="stroke_opacity.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="stroke_opacity">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        font_family
      </span>
      <select name="font_family.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="font_family">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        font_size
      </span>
      <select name="font_size.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="font_size">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        font_weight
      </span>
      <select name="font_weight.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      <input type="number" name="font_weight">
      
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        text_anchor
      </span>
      <select name="text_anchor.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      <select name="text_anchor">
        <option value=""></option>
        <option value="start">start</option><option value="middle">middle</option><option value="end">end</option>
      </select>
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        class
      </span>
      <select name="class.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="class">
      
      
      
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        curve
      </span>
      <select name="curve.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      <select name="curve">
        <option value=""></option>
        <option value="linear">linear</option><option value="step">step</option><option value="step_before">step_before</option><option value="step_after">step_after</option><option value="basis">basis</option><option value="cardinal">cardinal</option><option value="catmull_rom">catmull_rom</option><option value="monotone_x">monotone_x</option><option value="monotone_y">monotone_y</option><option value="natural">natural</option>
      </select>
      
      <ul class="vis-builder-key-errors">
        <li class="vis-builder-error">styles.series.curve: must be one of :linear, :step</li>
      </ul>
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        curve_opts
      </span>
      <select name="curve_opts.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      
      <textarea name="curve_opts"></textarea>
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        symbol
      </span>
      <select name="symbol.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      
      
      
      <select name="symbol">
        <option value=""></option>
        <option value="circle">circle</option><option value="cross">cross</option><option value="diamond">diamond</option><option value="square">square</option><option value="star">star</option><option value="triangle">triangle</option><option value="wye">wye</option>
      </select>
      
      
    </label><label class="vis-builder-field">
      <span class="vis-builder-key">
        symbol_size
      </span>
      <select name="symbol_size.mode" class="vis-builder-mode" title="literal, or a variable">
        <option value="literal" selected>literal</option>
        <option value="variable">variable</option>
      </select>
      
      
      
      <input type="text" name="symbol_size">
      
      
      
      
      
    </label>
  </form>
</div>
