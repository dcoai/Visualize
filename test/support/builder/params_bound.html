<div class="vis-builder-variables">
<form class="vis-builder-params" phx-change="set_var" phx-submit="submitted">
  <label class="vis-builder-param vis-builder-param-required">
    <span class="vis-builder-param-name">accent</span>
    
    
    <input type="text" name="accent">
    
    
    <span class="vis-builder-param-uses">marks[0].style</span>
  </label><label class="vis-builder-param">
    <span class="vis-builder-param-name">ticks</span>
    
    <input type="number" name="ticks" value="6" placeholder="3">
    
    
    
    <span class="vis-builder-param-uses">frame.axes[0].ticks</span>
  </label><label class="vis-builder-param">
    <span class="vis-builder-param-name">unit</span>
    
    
    <input type="text" name="unit" value="mg/hr" placeholder="%">
    
    
    <span class="vis-builder-param-uses">labels[0].text</span>
  </label>
</form>

<datalist id="vis-builder-params-names">
  
</datalist>
</div>
